# Checks only (decision #18). No build, no deploy: Vercel builds the SPA on its own and
# Cloud Run is deployed by deploy.yml, which is deliberately manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. Nothing here has side effects, so
# there is no reason to pay for a run whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # The integration tests need a real Postgres — the raw SQL they cover bypasses the
    # soft-delete extension and cannot be mocked (decision #26). Debian-based, matching
    # docker-compose.yml and Neon: musl collations sort differently from glibc, and every
    # listing is ordered and keyset-paginated on lower(name).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dataroom
          POSTGRES_PASSWORD: dataroom
          POSTGRES_DB: dataroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataroom -d dataroom" --health-interval 5s --health-timeout 5s
          --health-retries 20

    # `prisma.config.ts` resolves env('DIRECT_URL') when the config file is LOADED, so
    # every Prisma CLI invocation needs it set — including `prisma generate`, which runs
    # as @dr/api's postinstall, reads only the schema and never opens a connection.
    # Locally the variable comes from `.env`; there is none here, and there must not be.
    #
    # TEST_DATABASE_URL is the one the harness actually dials. It names a database of its
    # own rather than the one above: the harness empties every table between tests, and
    # `prisma migrate deploy` creates it on first use.
    env:
      DIRECT_URL: postgresql://dataroom:dataroom@127.0.0.1:5432/dataroom
      TEST_DATABASE_URL: postgresql://dataroom:dataroom@127.0.0.1:5432/dataroom_test

    steps:
      - uses: actions/checkout@v5

      # Order matters: pnpm must exist before setup-node, because `cache: pnpm` asks pnpm
      # where its store is. Enabling corepack afterwards leaves setup-node without a pnpm
      # to interrogate and the step fails with a confusing "Unable to locate executable".
      - name: Enable corepack
        run: corepack enable

      # Spelled inline rather than through a version file: `mise.toml` already pins the
      # local toolchain and root package.json carries `engines`, and a third file saying
      # "22" is one more thing that can drift out of step with the other two.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      # --frozen-lockfile is the supply-chain gate, not a speed-up: it fails if the
      # lockfile and the manifests disagree, and it fails while any dependency's install
      # scripts are unapproved in `allowBuilds`.
      - name: Install
        run: pnpm install --frozen-lockfile

      # @dr/contracts emits the declarations both apps type-check against, so nothing
      # below can pass without it. It is not a redundant build step.
      - name: Build contracts
        run: pnpm --filter @dr/contracts build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
